# Caché en disco para los sprites de Showdown (se conservan 30 días aunque nadie los pida)
proxy_cache_path /var/cache/nginx/showdown levels=1:2 keys_zone=showdown:5m
                 max_size=100m inactive=30d use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ficheros con hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Showdown no envía cabeceras CORS, así que el navegador no podría recortar sus sprites.
    # Solo se reenvía la carpeta de sprites de entrenador: no es un proxy abierto.
    location /proxy/showdown/sprites/trainers/ {
        proxy_pass https://play.pokemonshowdown.com/sprites/trainers/;
        proxy_ssl_server_name on;
        proxy_set_header Host play.pokemonshowdown.com;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_cache showdown;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1d;
        add_header X-Cache $upstream_cache_status;
    }
}
