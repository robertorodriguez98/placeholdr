<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dc5c33" />
    <title>pokebinder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='2' width='26' height='28' rx='3' fill='%23fff' stroke='%23000' stroke-width='3'/%3E%3Crect x='3' y='2' width='26' height='8' fill='%23dc5c33' stroke='%23000' stroke-width='3'/%3E%3Ccircle cx='16' cy='19' r='5' fill='%23f6d4c7' stroke='%23dc5c33' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <aside class="panel">
      <!-- El panel es una carta de Partidario: banda, título subrayado y medallón -->
      <header class="band">
        <span class="band-kicker" data-i18n="band.kicker">TRAINER</span>
        <div class="band-right">
          <div class="ui-lang" role="radiogroup" data-i18n-aria="ui.lang" aria-label="Interface language"></div>
          <span class="band-pill">POKEBINDER</span>
        </div>
      </header>
      <div class="panel-body">
        <div class="hero">
          <h1 data-i18n="hero">Placeholders for your binder</h1>
          <div class="medallion" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <rect x="13" y="10" width="38" height="46" rx="4" fill="#fff" stroke="#16181d" stroke-width="3.5"/>
              <rect x="13" y="10" width="38" height="10" rx="2" fill="#dc5c33" stroke="#16181d" stroke-width="3.5"/>
              <g fill="#fbe3da" stroke="#dc5c33" stroke-width="1.6">
                <rect x="19" y="25" width="7.5" height="10" rx="1"/><rect x="28.25" y="25" width="7.5" height="10" rx="1"/>
                <rect x="37.5" y="25" width="7.5" height="10" rx="1"/><rect x="19" y="39" width="7.5" height="10" rx="1"/>
                <rect x="28.25" y="39" width="7.5" height="10" rx="1"/><rect x="37.5" y="39" width="7.5" height="10" rx="1"/>
              </g>
              <g fill="#16181d"><circle cx="13" cy="24" r="2.6"/><circle cx="13" cy="33" r="2.6"/><circle cx="13" cy="42" r="2.6"/></g>
            </svg>
          </div>
        </div>

        <div class="tabs" role="tablist" data-i18n-aria="mode" aria-label="Mode">
          <button role="tab" data-mode="set" aria-selected="true" data-i18n="mode.set">Set</button>
          <button role="tab" data-mode="dex" aria-selected="false" data-i18n="mode.dex">Pokédex</button>
        </div>

        <section id="set-panel" class="block">
          <h2 class="pill-title" data-i18n="set">Set</h2>
          <select id="set-select" data-i18n-aria="set" aria-label="Set" disabled><option data-i18n="set.loading">Loading sets…</option></select>

          <h2 class="pill-title" data-i18n="collection">Collection</h2>
          <div class="segmented" role="radiogroup" data-i18n-aria="collection" aria-label="Collection">
            <label data-i18n-title="coll.base.tip">
              <input type="radio" name="collection" value="base" /><span data-i18n="coll.base">Base</span></label>
            <label data-i18n-title="coll.complete.tip">
              <input type="radio" name="collection" value="complete" checked /><span data-i18n="coll.complete">Complete</span></label>
            <label data-i18n-title="coll.master.tip">
              <input type="radio" name="collection" value="master" /><span data-i18n="coll.master">Master</span></label>
          </div>

          <h2 class="pill-title" data-i18n="types">Card types</h2>
          <div class="chips">
            <label class="chip"><input type="checkbox" name="only" value="pokemon" checked /><span data-i18n="type.pokemon">Pokémon</span></label>
            <label class="chip"><input type="checkbox" name="only" value="trainer" checked /><span data-i18n="type.trainer">Trainer</span></label>
            <label class="chip"><input type="checkbox" name="only" value="energy" checked /><span data-i18n="type.energy">Energy</span></label>
          </div>
        </section>

        <section id="dex-panel" class="block" hidden>
          <h2 class="pill-title" data-i18n="dex.selection">Selection</h2>
          <select id="dex-by" data-i18n-aria="dex.selection" aria-label="Selection">
            <option value="gen" data-i18n="dex.byGen">By generation</option>
            <option value="range" data-i18n="dex.byRange">By range</option>
            <option value="ids" data-i18n="dex.byIds">Individual numbers</option>
          </select>
          <div id="dex-gen" class="chips gens"></div>
          <input id="dex-range-input" data-i18n-aria="dex.range" aria-label="Range" placeholder="1-151" value="1-151" hidden />
          <input id="dex-ids-input" data-i18n-aria="dex.ids" aria-label="Numbers" placeholder="1, 4, 7, 25" hidden />
        </section>

        <section class="block">
          <h2 class="pill-title" data-i18n="checklist">Checklist</h2>
          <div class="tally">
            <div class="tally-row"><strong id="owned-count">0</strong><span id="owned-of">of 0</span><em id="owned-pct">0 %</em></div>
            <div class="meter"><div id="owned-bar"></div></div>
          </div>
          <label class="switch"><input type="checkbox" id="hide-owned" /><span class="track"></span>
            <span data-i18n="hideOwned">Print only missing cards</span></label>
          <p class="hint" data-i18n="checklist.hint">Click a card in the preview to mark it as yours.</p>
          <div class="btn-row">
            <button class="btn" id="mark-all" data-i18n="markAll">Mark all</button>
            <button class="btn" id="unmark-all" data-i18n="unmarkAll">Unmark</button>
          </div>
          <div class="btn-row">
            <button class="btn" id="import-csv" data-i18n="importCsv">Import CSV</button>
            <button class="btn" id="export-csv" data-i18n="exportCsv">Export CSV</button>
            <input type="file" id="csv-file" accept=".csv,text/csv,text/plain" hidden />
          </div>
        </section>

        <section class="block">
          <h2 class="pill-title" data-i18n="print">Printing</h2>
          <div class="pair">
            <select id="lang" data-i18n-aria="cardLang" data-i18n-title="cardLang" aria-label="Card language"></select>
            <select id="paper" data-i18n-aria="paper" aria-label="Paper"><option value="a4">A4</option><option value="letter" data-i18n="paper.letter">Letter</option></select>
          </div>
          <label class="switch"><input type="checkbox" id="bw" /><span class="track"></span><span data-i18n="bw">Black &amp; white</span></label>
          <label class="switch" data-i18n-title="frame.tip">
            <input type="checkbox" id="frame" checked /><span class="track"></span><span data-i18n="frame">Black borders</span></label>
          <label class="switch"><input type="checkbox" id="cutlines" checked /><span class="track"></span><span data-i18n="cutlines">Cutting guides</span></label>
        </section>
      </div>

      <footer class="actions">
        <button id="pdf" class="primary" disabled>
          <span data-i18n="pdf">Download PDF</span><span class="diamond" aria-hidden="true">◆</span>
        </button>
        <div class="meter slim" id="progress" hidden><div></div></div>
        <p id="status" class="status" aria-live="polite"></p>
      </footer>
    </aside>

    <main class="stage">
      <header class="stage-bar">
        <div class="stage-title">
          <span class="stage-kicker" id="stage-kicker" data-i18n="stage.mode">SET</span>
          <h2 id="stage-name">…</h2>
        </div>
        <div class="stage-pills" id="stage-pills"></div>
      </header>
      <div id="preview" class="preview"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
